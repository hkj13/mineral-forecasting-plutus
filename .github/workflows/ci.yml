name: CI/CD Pipeline

on:
  push:
    branches: [main, windsurf/autogen]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt
      
      # Frontend checks
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      
      - name: Lint frontend
        run: npm run lint
        working-directory: web
      
      - name: Build frontend
        run: npm run build
        working-directory: web
      
      # Backend checks
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: api
      
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio httpx
      
      - name: Generate mock data
        run: python mock_generator.py
        working-directory: data
      
      - name: Run backend tests
        run: pytest tests/ -v --tb=short || echo "No tests found, skipping"
        working-directory: .

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t mineral-forecasting-api:latest .
      
      - name: Test Docker image
        run: |
          docker run -d --name test-api -p 8000:8000 mineral-forecasting-api:latest
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop test-api
